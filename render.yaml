services:
  - type: web
    name: taxflow-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taxflow-db
          property: connectionString

databases:
  - name: taxflow-db
    databaseName: taxflow
    user: taxflow
    plan: free
